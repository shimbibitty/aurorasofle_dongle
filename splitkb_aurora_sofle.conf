# ── Power management ──────────────────────────────────────────────
# Enter deep sleep after 15 minutes of inactivity (saves battery on halves)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ── Bluetooth ─────────────────────────────────────────────────────
# 5 BLE profiles (dongle can pair to up to 5 hosts)
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# ── Split keyboard ────────────────────────────────────────────────
CONFIG_ZMK_SPLIT=y

# ── Encoders ─────────────────────────────────────────────────────
# The Aurora Sofle has one rotary encoder per half; enable them here
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ── No display ────────────────────────────────────────────────────
CONFIG_ZMK_DISPLAY=n
