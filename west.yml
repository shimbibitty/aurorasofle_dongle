manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: splitkb
      url-base: https://github.com/splitkb
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # splitkb Aurora module — provides the Aurora Sofle shield definitions
    - name: zmk-aurora
      remote: splitkb
      repo-name: zmk-aurora
      revision: main
  self:
    path: config
