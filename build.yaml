---
include:
  # Left half — peripheral (no display)
  - board: nice_nano_v2
    shield: splitkb_aurora_sofle_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  # Right half — peripheral (no display)
  - board: nice_nano_v2
    shield: splitkb_aurora_sofle_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  # Dongle — central, connects to both halves over BLE, wired to host via USB
  - board: nice_nano_v2
    shield: splitkb_aurora_sofle_dongle
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=y
      -DCONFIG_ZMK_STUDIO_LOCKING=n

  # Settings reset — flash this first if you ever need to clear pairing state
  - board: nice_nano_v2
    shield: settings_reset
