# ── Dongle is the BLE central + USB HID host ──────────────────────
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
# Central (dongle) talks to 2 peripherals + 5 host BT profiles
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Always connect via USB (dongle is plugged into PC)
CONFIG_ZMK_USB=y

# No display on the dongle
CONFIG_ZMK_DISPLAY=n

# Encoders are on the halves, not the dongle
CONFIG_EC11=n
